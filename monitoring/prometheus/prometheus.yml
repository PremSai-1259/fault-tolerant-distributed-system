global: {scrape_interval: 10s}
rule_files: [alerts.yml]
scrape_configs:
  - job_name: applications
    kubernetes_sd_configs: [{role: endpoints, namespaces: {names: [fault-tolerance]}}]
    relabel_configs:
      - {source_labels: [__meta_kubernetes_service_name], regex: '(result|marks|attendance|eligibility)-service', action: keep}
      - {source_labels: [__meta_kubernetes_endpoint_port_name], regex: .*, action: keep}
  - job_name: kubernetes-nodes
    kubernetes_sd_configs: [{role: node}]
  - job_name: failure-detector
    static_configs: [{targets: [failure-detector.fault-tolerance.svc:8001]}]
  - job_name: node-exporter
    static_configs: [{targets: [node-exporter.fault-tolerance.svc:9100]}]
  - job_name: kube-state-metrics
    static_configs: [{targets: [kube-state-metrics.fault-tolerance.svc:8080]}]
