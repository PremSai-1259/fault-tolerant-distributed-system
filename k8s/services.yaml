apiVersion: apps/v1
kind: Deployment
metadata:
  name: eligibility
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eligibility
  template:
    metadata:
      labels:
        app: eligibility
    spec:
      containers:
        - name: eligibility
          image: student-eligibility:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: eligibility-service
spec:
  selector:
    app: eligibility
  ports:
    - port: 8000
      targetPort: 8000
---
