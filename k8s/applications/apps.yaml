apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: fault-tolerance}
data: {DOWNSTREAM_TIMEOUT: "1.5"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: result, namespace: fault-tolerance, labels: {app: result}}
spec:
  replicas: 2
  selector: {matchLabels: {app: result}}
  template:
    metadata: {labels: {app: result}}
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints: [{maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: result}}}]
      containers: [{name: result, image: ft/result:local, imagePullPolicy: IfNotPresent, env: [{name: SERVICE_NAME, value: result}, {name: SERVICE_MODULE, value: services.result.app}, {name: MARKS_URL, value: http://marks-service:8000}, {name: ATTENDANCE_URL, value: http://attendance-service:8000}], ports: [{containerPort: 8000}], resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}, startupProbe: {httpGet: {path: /health/live, port: 8000}, failureThreshold: 30, periodSeconds: 2}, livenessProbe: {httpGet: {path: /health/live, port: 8000}, periodSeconds: 10}, readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 5}}]
---
apiVersion: v1
kind: Service
metadata: {name: result-service, namespace: fault-tolerance, labels: {app: result}}
spec: {selector: {app: result}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: result-pdb, namespace: fault-tolerance}
spec: {minAvailable: 1, selector: {matchLabels: {app: result}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: marks, namespace: fault-tolerance, labels: {app: marks}}
spec:
  replicas: 2
  selector: {matchLabels: {app: marks}}
  template:
    metadata: {labels: {app: marks}}
    spec:
      topologySpreadConstraints: [{maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: marks}}}]
      containers: [{name: marks, image: ft/marks:local, imagePullPolicy: IfNotPresent, env: [{name: SERVICE_NAME, value: marks}, {name: SERVICE_MODULE, value: services.marks.app}], ports: [{containerPort: 8000}], resources: {requests: {cpu: 75m, memory: 96Mi}, limits: {cpu: 300m, memory: 192Mi}}, startupProbe: {httpGet: {path: /health/live, port: 8000}, failureThreshold: 30, periodSeconds: 2}, livenessProbe: {httpGet: {path: /health/live, port: 8000}}, readinessProbe: {httpGet: {path: /health/ready, port: 8000}}}]
---
apiVersion: v1
kind: Service
metadata: {name: marks-service, namespace: fault-tolerance, labels: {app: marks}}
spec: {selector: {app: marks}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: marks-pdb, namespace: fault-tolerance}
spec: {minAvailable: 1, selector: {matchLabels: {app: marks}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: attendance, namespace: fault-tolerance, labels: {app: attendance}}
spec:
  replicas: 2
  selector: {matchLabels: {app: attendance}}
  template:
    metadata: {labels: {app: attendance}}
    spec:
      topologySpreadConstraints: [{maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: attendance}}}]
      containers: [{name: attendance, image: ft/attendance:local, imagePullPolicy: IfNotPresent, env: [{name: SERVICE_NAME, value: attendance}, {name: SERVICE_MODULE, value: services.attendance.app}, {name: ELIGIBILITY_URL, value: http://eligibility-service:8000}], ports: [{containerPort: 8000}], resources: {requests: {cpu: 75m, memory: 96Mi}, limits: {cpu: 300m, memory: 192Mi}}, startupProbe: {httpGet: {path: /health/live, port: 8000}, failureThreshold: 30, periodSeconds: 2}, livenessProbe: {httpGet: {path: /health/live, port: 8000}}, readinessProbe: {httpGet: {path: /health/ready, port: 8000}}}]
---
apiVersion: v1
kind: Service
metadata: {name: attendance-service, namespace: fault-tolerance, labels: {app: attendance}}
spec: {selector: {app: attendance}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: eligibility, namespace: fault-tolerance, labels: {app: eligibility}}
spec:
  replicas: 2
  selector: {matchLabels: {app: eligibility}}
  template:
    metadata: {labels: {app: eligibility}}
    spec:
      containers: [{name: eligibility, image: ft/eligibility:local, imagePullPolicy: IfNotPresent, env: [{name: SERVICE_NAME, value: eligibility}, {name: SERVICE_MODULE, value: services.eligibility.app}], ports: [{containerPort: 8000}], resources: {requests: {cpu: 75m, memory: 96Mi}, limits: {cpu: 300m, memory: 192Mi}}, startupProbe: {httpGet: {path: /health/live, port: 8000}, failureThreshold: 30, periodSeconds: 2}, livenessProbe: {httpGet: {path: /health/live, port: 8000}}, readinessProbe: {httpGet: {path: /health/ready, port: 8000}}}]
---
apiVersion: v1
kind: Service
metadata: {name: eligibility-service, namespace: fault-tolerance, labels: {app: eligibility}}
spec: {selector: {app: eligibility}, ports: [{port: 8000, targetPort: 8000}]}
