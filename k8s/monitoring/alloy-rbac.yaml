apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: fault-tolerance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-pod-reader
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: fault-tolerance
roleRef:
  kind: ClusterRole
  name: alloy-pod-reader
  apiGroup: rbac.authorization.k8s.io
