apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-exporter, namespace: fault-tolerance}
spec:
  selector: {matchLabels: {app: node-exporter}}
  template:
    metadata: {labels: {app: node-exporter}}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.8.2
        args: [--path.rootfs=/host]
        ports: [{name: metrics, containerPort: 9100}]
        volumeMounts: [{name: root, mountPath: /host, readOnly: true, mountPropagation: HostToContainer}]
      volumes: [{name: root, hostPath: {path: /}}]
---
apiVersion: v1
kind: Service
metadata: {name: node-exporter, namespace: fault-tolerance}
spec: {selector: {app: node-exporter}, ports: [{name: metrics, port: 9100, targetPort: metrics}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: fault-tolerance}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kube-state-metrics}
rules:
- {apiGroups: [""], resources: [configmaps, secrets, nodes, pods, services, resourcequotas, replicationcontrollers, limitranges, persistentvolumeclaims, persistentvolumes, namespaces], verbs: [list, watch]}
- {apiGroups: [apps], resources: [statefulsets, daemonsets, deployments, replicasets], verbs: [list, watch]}
- {apiGroups: [batch], resources: [cronjobs, jobs], verbs: [list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kube-state-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: fault-tolerance}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: fault-tolerance}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers: [{name: kube-state-metrics, image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0, ports: [{name: metrics, containerPort: 8080}], resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}}]
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: fault-tolerance}
spec: {selector: {app: kube-state-metrics}, ports: [{name: metrics, port: 8080, targetPort: metrics}]}
