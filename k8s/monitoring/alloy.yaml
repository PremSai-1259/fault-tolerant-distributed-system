apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: fault-tolerance
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
      - name: alloy
        image: grafana/alloy:latest
        args:
          - run
          - /etc/alloy/config.alloy
        volumeMounts:
          - name: config
            mountPath: /etc/alloy
          - name: logs
            mountPath: /var/log
            readOnly: true
          - name: pods
            mountPath: /var/lib/kubelet/pods
            readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: logs
          hostPath:
            path: /var/log
        - name: pods
          hostPath:
            path: /var/lib/kubelet/pods

